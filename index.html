<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LemonChat — Nhắn tin an toàn, nhanh chóng và riêng tư." />
    <meta name="theme-color" content="#facc15" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LemonChat — Nhắn tin an toàn</title>
    <script>
      // GitHub Pages SPA redirect — decode URL encoded by 404.html
      ;(function () {
        var p = window.location.search.slice(1)
        if (p && p[0] === 'p') {
          var decoded = decodeURIComponent(p.slice(2))
          var parts = decoded.split('&q=')
          window.history.replaceState(
            null,
            null,
            window.location.pathname.split('/').slice(0, 2).join('/') +
              '/' +
              parts[0] +
              (parts[1] ? '?' + parts[1] : '') +
              window.location.hash,
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

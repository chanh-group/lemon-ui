<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LemonChat — Nhắn tin an toàn, nhanh chóng và riêng tư." />
    <meta name="theme-color" content="#00e676" />

    <!-- Open Graph (Zalo, Facebook, chat apps link preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LemonChat — Nhắn tin an toàn" />
    <meta property="og:description" content="Nhắn tin dễ dàng, trò chuyện vui vẻ mỗi ngày. Kết nối với những người bạn." />
    <meta property="og:image" content="https://lemon.lnguienl.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LemonChat" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LemonChat — Nhắn tin an toàn" />
    <meta name="twitter:description" content="Nhắn tin dễ dàng, trò chuyện vui vẻ mỗi ngày." />
    <meta name="twitter:image" content="https://lemon.lnguienl.online/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://lemon.lnguienl.online/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <title>LemonChat — Nhắn tin an toàn</title>
    <script>
      // Anti-FOUC: set dark class trước khi React mount
      ;(function () {
        var t = localStorage.getItem('lemonchat.theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
